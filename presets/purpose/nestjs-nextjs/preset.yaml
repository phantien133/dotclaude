# yaml-language-server: $schema=../../schema/preset.schema.json
name: nestjs-nextjs
kind: purpose
description: >-
  Full-stack NestJS + Next.js development workflow — TDD, Figma design integration,
  browser verification, and doc governance. Combines the full w-task workflow suite
  (intake → context → plan → impact → UI/Figma → TDD → browser-verify → docs → PR)
  with the f-* Figma skill suite and Chrome DevTools MCP for localhost UI verification.
  v0.3.0 workflow v2: per-repo/submodule default branches (main vs master) via workflow.yaml
  repos[], terminal one-PR-per-repo Phase 6, and w-setup version detection + auto-migration.
  DEPRECATED as of v0.4.0 — superseded by `nextjs-combo`, which is the maintained port of
  cistreaming v2 (official Figma MCP suite, Figma subagents, visual parity gate, infra
  security review). v0.4.0 only extends the `figma` preset so existing installs keep
  working with w-task's engine-aware Phase 3; no further features will land here.
version: 0.4.0
extends:
  - nestjs
  - nextjs
  - figma
components:
  agents:
    - name: tdd-guide
      source: everything-claude-code
  skills:
    # ── workflow core ──────────────────────────────────────────────────────────
    - name: w-task
      source: workflow
    - name: w-fix
      source: workflow
    - name: w-checkpoint
      source: workflow
    - name: workflow-setup
      source: workflow

    # ── workflow helpers ───────────────────────────────────────────────────────
    - name: w-context-load
      source: workflow
    - name: w-oq-check
      source: workflow
    - name: w-impact-analyzer
      source: workflow
    - name: w-adr
      source: workflow
    - name: w-test-stubs
      source: workflow
    - name: w-feature-record
      source: workflow
    - name: w-api-doc
      source: workflow
    - name: w-db-doc
      source: workflow
    - name: w-doc-gate
      source: workflow
    - name: w-document-build-up
      source: workflow

    # ── Figma legacy fallback (REST @figma/mcp) ───────────────────────────────
    # The official suite arrives via `extends: figma`. These remain installed so
    # w-task Phase 3 still works on projects that have not migrated their MCP config.
    - name: f-extract
      source: figma
    - name: f-implement
      source: figma
    - name: f-import
      source: figma
    - name: f-ui-kit
      source: figma
    - name: f-page
      source: figma
    - name: f-review
      source: figma

  commands:
    - name: w-setup
      source: workflow
    - name: w-status
      source: workflow
    - name: w-reset
      source: workflow
    - name: w-pr
      source: workflow
    - name: f-setup
      source: figma

settings_patch:
  mcpServers:
    chrome-devtools:
      command: npx
      args:
        - "-y"
        - "chrome-devtools-mcp@latest"

external_setup:
  - name: chrome-devtools
    kind: mcp_server
    standalone: false
    install_hint: "Auto-installs via npx. Requires Node.js and Google Chrome 144+."
    complexity: simple
    docs_url: "https://github.com/ChromeDevTools/chrome-devtools-mcp"
    notes: >-
      Used by w-task Phase 4c for localhost UI verification. Phase 4c is skipped
      gracefully when dev_server_command is not set in workflow.yaml.

recommended_install_level: project
tags:
  - nestjs
  - nextjs
  - fullstack
  - workflow
  - tdd
  - figma
  - browser-verify
  - doc-governance
use_case_tags:
  roles:
    - fullstack-developer
    - backend-developer
    - developer
  project_types:
    - monorepo
    - web-app
  stacks:
    - typescript
    - nestjs
    - nextjs
    - graphql
    - prisma
    - redis
  use_cases:
    - dev-workflow
    - tdd
    - ui-integration
    - browser-verify
    - figma
    - pr-workflow
    - api-development
    - doc-governance
