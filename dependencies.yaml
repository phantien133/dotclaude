# dependencies.yaml — Upstream sources for dotclaude
#
# After CQ-1c/CQ-7 redesign: claudekit/ is the source of truth (plain copy with
# provenance tracked in sidecars). upstream/ serves only as a "source for diff/sync"
# via scripts/sync-from-upstream.ts — it is NO LONGER a runtime dependency.
#
# Refresh workflow:
#   1. git submodule update --remote upstream/<name>
#   2. git -C upstream/<name> rev-parse HEAD  → update pinned_commit below
#   3. pnpm sync <component>  (per-component diff)
#   4. Owner merges manually, updates sidecar source.commit if adopting the new commit
#   5. Commit dependencies.yaml + .gitmodules + sidecar updates

version: 2

sources:
  ecc:
    name: everything-claude-code
    description: Battle-tested agents/skills/hooks/commands collection
    repo: https://github.com/affaan-m/everything-claude-code
    local_path: upstream/everything-claude-code
    pinned_commit: 5b173d2e6c11b976a0f13b2f59125e08956c1d47
    ref: main
    role: sync_source
    license: MIT

  anthropic_cookbook:
    name: anthropic-cookbook
    description: Official Anthropic API + Claude Code recipe collection
    repo: https://github.com/anthropics/anthropic-cookbook
    local_path: upstream/anthropic-cookbook
    pinned_commit: 34022c55c1fde7056280e01b84f562cb92575cb5
    ref: main
    role: docs
    license: MIT

  anthropic_skills:
    name: anthropic-skills
    description: Official Anthropic skills collection (skill format reference)
    repo: https://github.com/anthropics/skills
    local_path: upstream/anthropic-skills
    pinned_commit: 57546260929473d4e0d1c1bb75297be2fdfa1949
    ref: main
    role: docs
    license: MIT

  mcp_servers:
    name: mcp-servers
    description: Official Model Context Protocol server implementations
    repo: https://github.com/modelcontextprotocol/servers
    local_path: upstream/mcp-servers
    pinned_commit: 275175cda17ca9c49920ceed2bcf27e12e59f8b2
    ref: main
    role: docs
    license: MIT

  claude_code:
    name: claude-code
    description: Official Claude Code CLI — plugin collection with vendorable agents/skills/commands/hooks (plugins/ dir), plus AGENTS.md format and hook schema reference
    repo: https://github.com/anthropics/claude-code
    local_path: upstream/claude-code
    pinned_commit: ca9f6045fc90c8244f9e787fb57d54b380f9a27c
    ref: main
    role: sync_source
    license: MIT

  # Removed 2026-05-14: claudekit/dotclaude/ is now self-authored directly in
  # this repo's main tree (no separate `components` branch, no upstream/dotclaude
  # submodule). The folders claudekit/dotclaude/{dotclaude-self,workflow,figma}/
  # are the source of truth — edit them in-place and commit. SOURCE.yaml
  # sidecars under those folders are retained for schema compliance but their
  # `source.repo` / `source.commit` fields are informational only (no live
  # upstream).

  claude_plugins_official:
    name: claude-plugins-official
    description: Anthropic's official Claude Code plugin directory — internal Anthropic plugins (plugins/) plus vetted third-party plugins (external_plugins/) installable via /plugin install …@claude-plugins-official
    repo: git@github.com:anthropics/claude-plugins-official.git
    local_path: upstream/claude-plugins-official
    pinned_commit: 093e3563c30a56a67d86fa723f6ab1d5957b5b08
    ref: main
    role: sync_source
    license: MIT

  figma_mcp_server_guide:
    name: figma-mcp-server-guide
    description: Figma's official Claude Code plugin source (figma@claude-plugins-official) — skills like figma-implement-design, figma-code-connect, figma-create-design-system-rules, figma-generate-library plus MCP config pointing to https://mcp.figma.com/mcp. Reference for f-* flow rebuild; not for vendoring (LICENSE absent in upstream repo).
    repo: https://github.com/figma/mcp-server-guide.git
    local_path: upstream/figma-mcp-server-guide
    pinned_commit: 2efd0e37d10c35c4a7cf6d2b7381c9dc1a569bd4
    ref: main
    role: docs
    license: unspecified

  pm_skills:
    name: pm-skills
    description: Product-management skills collection by Pawel Huryn — PRD/strategy/discovery/GTM/analytics skill packs (pm-execution, pm-product-strategy, pm-product-discovery, pm-go-to-market, pm-market-research, pm-marketing-growth, pm-data-analytics, pm-ai-shipping, pm-toolkit). No infra/aws content. Vendorable (MIT).
    repo: git@github.com:phuryn/pm-skills.git
    local_path: upstream/pm-skills
    pinned_commit: d384f0c9eb81fe74656a4f6da168587836939edb
    ref: main
    role: sync_source
    license: MIT
