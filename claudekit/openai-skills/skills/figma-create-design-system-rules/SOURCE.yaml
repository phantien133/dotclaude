modified: true
modifications: >-
  1. Appended an "Agent delegation (dotclaude)" section — inventory the project's real
  tokens/components via figma-design-system-mapper and the Figma variable definitions via
  figma-context-extractor, so generated rules describe what the repo contains rather than
  framework defaults (a rules file describing a token scale the project lacks teaches the
  model to invent values).
  2. Added an instruction to extend, not restate or contradict, the figma-fidelity rules
  this plugin already installs.
  3. Dropped upstream agents/openai.yaml, assets/ and maintainers.yml.
notes: >-
  Generates a project-specific CLAUDE.md/AGENTS.md design-system rules file. Run once per
  project after the component library stabilises; its output complements the always-on
  figma-fidelity rule with stack-specific conventions. Keeps upstream
  scripts/check_agents_md.sh and references/rule-template.md.
