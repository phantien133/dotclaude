source:
  repo: https://github.com/phantien133/dotclaude
  commit: f2f3be0233f15845decc89b79be8128a8ea25d84
  path: workflow/commands/w-setup.md
  ref: components
imported_at: "2026-05-13"
license: MIT
modified: true
modifications: >-
  Workflow v2 (multi-repo). Step 0: version detection vs CURRENT_VERSION=2; an older
  config triggers Step 0a auto-migration-with-confirm (preserves all values, adds
  repos[] + bumps version, no re-interview). Step 1 survey now enumerates git
  submodules and each repo's own default branch. New Step 7a configures the top-level
  repos[] list ({path, default_branch, remote}; path "." = main workspace) so a
  superproject can mix main and master per repo. Written YAML is version: 2 with repos[].
  Workflow v3 (2026-08-26): CURRENT_VERSION 2 -> 3. Step 0a migration is now staged (v1->v2 repos[],
  then v2->v3) and add-only. v3 adds project.codegraph.{enabled,auto_index,sync_phases} and
  verify.{acceptance,visual,max_loops,browser_wait_seconds}, plus project.dev_server_command/port
  in the written template. New Step 5a (CodeGraph probe + one confirm card, never indexes here —
  w-task asks on the first task) and Step 5b (acceptance verification defaults). Summary card
  reports config version 3, CodeGraph and Acceptance rows.
notes: >-
  Workflow config wizard. Writes .claude/workflow.yaml — consumed by w-task, w-fix,
  w-status, w-reset, w-pr, w-checkpoint. Spawns code-explorer agent to survey project
  before suggesting config values. Supports GitHub Issues, Plane (MCP/paste), Jira,
  Linear, and free-text. Run once per project.
dependencies:
  required:
    agents:
      - code-explorer
    skills: []
    commands: []
    hooks: []
    rules: []
  optional:
    agents: []
    skills: []
    commands: []
    hooks: []
    rules: []
  external:
    - name: gh
      type: system_binary
      reason: GitHub CLI is probed during setup to detect remote and validate issue-tracker config.
tags:
  - workflow
  - setup
  - config
  - wizard
categories:
  purpose:
    - setup
    - workflow
  mechanism:
    - guided-steps
    - interactive
