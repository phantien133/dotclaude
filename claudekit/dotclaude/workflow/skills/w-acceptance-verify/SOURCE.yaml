notes: >-
  Self-authored Phase 5b helper. Builds a stable requirement-to-evidence matrix from
  intake / questions / plan / figma spec, fans out adversarial verifier agents (ticket
  coverage, test adequacy, language review, doc accuracy, out-of-scope), and runs visual
  verification against the Figma design export so wrong or invented assets are caught
  before the PR. Writes acceptance.md; on an exhausted fix loop writes a human-readable
  open-issues.md and sets status: blocked. Exit code is 0 only when no blocker and no
  major finding remains, which is what drives the w-task Phase 5b loop.
