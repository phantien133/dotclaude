#
# SOURCE.yaml is INSIDE the skill folder.
# Installer MUST exclude this file when copying the skill folder to a target.
#
# Self-authored — extends w-task with Phase 4c browser verification.
source:
  repo: https://github.com/phantien133/dotclaude
  commit: 7d6113b47b391c81d1bc103cfd28eed0829b8657
  path: workflow/skills/w-task
  ref: develop
imported_at: "2026-05-28"
license: MIT
modified: true
modifications: >-
  Phase 0: added UI signal detection (0.4) and conditional pause card (0.5) — proactively
  detects Figma URL and UI keywords from intake, asks targeted questions instead of generic ones.
  Saves has_ui + figma_url to state.yaml. Phase 0b updated to read developer's figma_url reply.
  Phase 3: replaced passive gate with active orchestration — f-extract (Figma MCP snapshot) →
  f-implement (code from snapshot, strict ASSET_PLACEHOLDER, unclear-design gate) →
  asset resolution gate (3.3) → finalize. State transitions table updated.
  Phase 6: fully automated — branch sync (fetch + auto-merge default branch, pause on conflict),
  doc gate (w-doc-gate auto-invoked), PR auto-created via w-pr --skip-doc-gate. Developer
  no longer needs to manually run /w-pr.
  Phase 4 step 11: conditional mobile review — when impact.md has .dart files or mobile
  paths AND flutter-dart-code-review skill is installed, run it after the generic code-reviewer.
  Skipped silently otherwise so this remains safe for non-mobile projects.
  Phase 0b step 5: UI design pre-fetch — when has_ui + figma_url are set, run f-extract
  during context load so figma-snapshot.md exists BEFORE Phase 1 planning. Phase 1 planner
  brief now includes the snapshot so plans scope concrete UI surfaces instead of a bare URL
  (fixes plans under-scoping UI). Phase 3.1 reuses the pre-fetched snapshot and only
  re-extracts when it is missing.
  Workflow v2 (multi-repo): Setup resolves a REPOS list from the new top-level repos[]
  (synthesizing a single "." entry from pr.default_branch for v1 configs). Phase 6.0 syncs
  each repo against its OWN default branch via git -C <path> (a superproject may mix main and
  master). Phase 6.2 opens one PR per changed repo (submodules before the superproject), then
  does a SINGLE terminal state write (status: complete + prs[]) and stops — Phase 6 is now
  strictly terminal; re-running /w-task on a complete task is a no-op that reprints PR URLs.
  Figma engine split (2026-08-04): state.yaml gained `figma_engine`, resolved at Phase 0b
  step 5 by probing which Figma MCP tools exist — `official` (get_design_context present),
  `legacy` (only get_file*), or `none`. Phase 0b and 3.1 branch on it: official spawns
  figma-context-extractor / figma-asset-fetcher / figma-design-system-mapper and gates on
  resolving their gap + "No equivalent" lists with the developer; legacy keeps the old
  f-extract path with a one-line warning about its missing rendered reference. Phase 3.2
  routes to figma-implement-design (official) or f-implement (legacy). Phase 3.3 covers
  both TODO(figma-asset) markers and ASSET_PLACEHOLDER comments. NEW Phase 3.4 is a visual
  parity gate running figma-verify-parity — FAIL blocks advancement, NOT RUN is recorded
  distinctly from PASS so a skipped check reaches the PR description. Old 3.4 finalize
  became 3.5. Phase 1 planner brief accepts figma-spec.md or figma-snapshot.md.
notes: >-
  v2 of w-task — adds Phase 4c localhost browser verification via Chrome DevTools MCP,
  smart UI detection at Phase 0, and active Figma orchestration at Phase 3. Phase 3 now
  prefers the official Figma MCP path (figma-implement-design + the figma-* agents, with a
  visual parity gate) and falls back to the legacy f-extract/f-implement pair when only the
  REST server is available. Original w-task is unchanged.
dependencies:
  required:
    agents:
      - planner
      - tdd-guide
      - code-reviewer
    skills:
      - w-checkpoint
      - tdd-workflow
    commands:
      - w-pr
    hooks: []
    rules: []
  optional:
    # Figma subagents — used by Phase 0b/3 when figma_engine resolves to `official`.
    agents:
      - figma-context-extractor
      - figma-asset-fetcher
      - figma-design-system-mapper
      - figma-visual-verifier
    skills:
      # Official Figma MCP path (preferred at Phase 3).
      - figma-implement-design
      - figma-verify-parity
      # Legacy REST path (fallback when only @figma/mcp is available).
      - f-extract
      - f-implement
      - f-import
    commands: []
    hooks: []
    rules: []
  external:
    - name: chrome-devtools-mcp
      type: npm
      reason: >-
        Required for Phase 4c browser verification. Provides navigate_page,
        evaluate_script, get_console_messages, and take_screenshot tools.
        Installed via npx — requires Node.js and Chrome 144+. Phase 4c is
        skipped gracefully when this MCP is not configured.
    - name: gh
      type: system_binary
      reason: >-
        GitHub CLI is used by Phase 0 intake (`gh issue view <N>`) when
        `.claude/workflow.yaml` sets `issue_tracker.type: github`. Optional for other
        trackers — skill falls back to paste / free-text if `gh` is absent.
    - name: glab
      type: system_binary
      reason: >-
        GitLab CLI is required by `/w-pr` at Phase 6 to open the merge request, and by
        Phase 0 intake when `issue_tracker.type: gitlab` is configured.
tags:
  - workflow
  - tdd
  - feature-dev
  - config-driven
  - browser-verify
categories:
  purpose:
