# yaml-language-server: $schema=../../../presets/schema/sidecar.schema.json
#
# SOURCE.yaml is INSIDE the skill folder.
# Installer MUST exclude this file when copying the skill folder to a target.
#
# Vendored from upstream/dotclaude (components branch) — self-authored component library.
# Source of truth: upstream/dotclaude/workflow/skills/w-fix/
source:
  repo: https://github.com/phantien133/dotclaude
  commit: f2f3be0233f15845decc89b79be8128a8ea25d84
  path: workflow/skills/w-fix
  ref: components
imported_at: "2026-05-13"
license: MIT
modified: true
modifications: >-
  Workflow v2 (multi-repo). Setup reads repos[] (synthesizes a single "." entry from
  pr.default_branch for v1 configs). Phase 3 (PR) is now terminal and per-repo: run
  /w-pr per changed repo with --repo/--target, then a single final state write sets
  status: complete with prs[]. A later /w-fix on a complete task is a no-op that
  reprints the PR URLs.
  Workflow v3 (2026-08-26): Setup check probes w-codegraph once; 0.3 locates affected files via
  `codegraph query/callers/affected` when an index exists (a bug with no covering test in the
  affected list tells you what to write first), git grep otherwise. Phase 3 no longer ends with
  a dirty tree — after the terminal state write it commits <state_root>/<task-slug>/ and pushes
  it to the PR branch with a plain fast-forward push (never --force, never a rewrite); a
  gitignored state_root is detected and skipped, and a rejected push is merged then retried,
  or reported and left local.
notes: >-
  Lightweight bug-fix workflow. 4 phases: intake + locate → fix → commit + docs →
  PR. Scoped to ≤3 files, ≤2h; escalates to /w-task if scope grows. Config-driven
  via .claude/workflow.yaml. Runs inline code-reviewer check before commit.
dependencies:
  required:
    agents:
      - code-reviewer
    skills: []
    commands:
      - w-pr
    hooks: []
    rules: []
  optional:
    agents: []
    skills: []
    commands: []
    hooks: []
    rules: []
  external:
    - name: gh
      type: system_binary
      reason: >-
        GitHub CLI is used by Phase 0 intake (`gh issue view <N>`) when
        `.claude/workflow.yaml` sets `issue_tracker.type: github`. Optional for other
        trackers.
    - name: glab
      type: system_binary
      reason: >-
        GitLab CLI is required by `/w-pr` at Phase 3 to open the merge request, and by
        Phase 0 intake when `issue_tracker.type: gitlab` is configured.
tags:
  - workflow
  - bug-fix
  - quick-fix
  - config-driven
categories:
  purpose:
    - dev-workflow
    - bug-fix
  mechanism:
    - guided-steps
    - interactive
