modifications: >-
  Workflow v3 (2026-08-26): § Affected Files is now derived from the CodeGraph index when one
  exists — `codegraph impact/callers/callees` per changed symbol, unioned, with each row marked
  plan- or graph-derived. The graph set is authoritative because it surfaces indirect callers
  that plan prose and name greps miss; a graph-reported file is never dropped for being absent
  from the plan. Plan-derived extraction remains the fallback.
notes: >-
