notes: >-
  Self-authored. Downloads icons/images from the Figma MCP localhost asset endpoint into
  the project and writes figma-assets.md. Exists to kill the failure mode where the model
  hand-writes SVG paths or swaps in an icon-library glyph; it verifies every downloaded
  file and reports unresolved assets rather than approximating them.
dependencies:
  required:
    agents: []
    skills: []
    commands: []
    hooks: []
    rules:
      - figma-fidelity
  optional:
    agents:
      - figma-context-extractor
    skills: []
    commands: []
    hooks: []
    rules: []
  # Needs the official Figma MCP server's localhost asset endpoint to fetch real exports;
  # declared at preset level via external_setup (kind: mcp_server). Without it every asset
  # is reported unresolved for manual export rather than approximated.
  external: []
