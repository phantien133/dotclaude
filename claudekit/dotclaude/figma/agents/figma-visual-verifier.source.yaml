notes: >-
  Self-authored. Closes the loop that the old f-* suite never had: renders the built screen
  via chrome-devtools MCP, reads getComputedStyle for every property the Figma spec pins,
  and diffs numerically against the design before comparing screenshots. Emits
  figma-parity-report.md with file:line per defect. Cannot PASS with open blockers.
